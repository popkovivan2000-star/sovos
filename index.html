            originalRenderTaskbar(...args);
            const taskItem = document.getElementById(`s-${id}`) || document.querySelector(`[onclick*="openApp('${id}')"]`);
            if (taskItem) {
                const iconContainer = taskItem.querySelector('.task-ico') || taskItem;
                if (iconContainer && !iconContainer.innerHTML.includes('📡')) iconContainer.innerHTML = '📡';
                if (taskItem.hasAttribute('title')) taskItem.setAttribute('title', 'Связь');
                const textLabel = taskItem.querySelector('span');
                if (textLabel) textLabel.innerText = 'Связь';
            }
        };
    }

    function transliterate(word) {
        const encoder = {
            'а':'a', 'б':'b', 'в':'v', 'г':'g', 'д':'d', 'е':'e', 'ё':'yo', 'ж':'zh',
            'з':'z', 'и':'i', 'й':'y', 'к':'k', 'л':'l', 'м':'m', 'н':'n', 'о':'o',
            'п':'p', 'р':'r', 'с':'s', 'т':'t', 'у':'u', 'ф':'f', 'х':'h', 'ц':'ts',
            'ч':'ch', 'ш':'sh', 'щ':'shch', 'ъ':'', 'ы':'y', 'ь':'', 'э':'e', 'ю':'yu', 'я':'ya'
        };
        return word.split('').map(char => {
            let lower = char.toLowerCase();
            return encoder[lower] !== undefined ? encoder[lower] : char;
        }).join('');
    }

    function fetchNicknameFromUserBase() {
        let foundNick = null;
        const possibleVars = [
            typeof currentUser !== 'undefined' ? currentUser : null,
            typeof username !== 'undefined' ? username : null,
            typeof activeUser !== 'undefined' ? activeUser : null,
            typeof userProfile !== 'undefined' ? userProfile : null
        ];

        for (let v of possibleVars) {
            if (v) {
                if (typeof v === 'string') { foundNick = v; break; }
                if (typeof v === 'object') {
                    foundNick = v.name || v.username || v.nick || v.login;
                    if (foundNick) break;
                }
            }
        }

        if (!foundNick) {
            const possibleBases = [
                typeof userBase !== 'undefined' ? userBase : null,
                typeof users !== 'undefined' ? users : null,
                typeof accounts !== 'undefined' ? accounts : null,
                typeof sysUsers !== 'undefined' ? sysUsers : null,
                window.userBase, window.users, window.accounts, window.sysUsers
            ];

            for (let base of possibleBases) {
                if (base) {
                    if (Array.isArray(base) && base.length > 0) {
                        let first = base[0];
                        if (typeof first === 'string') { foundNick = first; break; }
                        if (typeof first === 'object' && first !== null) {
                            foundNick = first.name || first.username || first.nick || first.login;
                            if (foundNick) break;
                        }
                    } else if (typeof base === 'object') {
                        let keys = Object.keys(base);
                        if (keys.length > 0) {
                            let val = base[keys[0]];
                            if (typeof val === 'string') { foundNick = keys[0]; break; }
                            if (typeof val === 'object' && val !== null) {
                                foundNick = val.name || val.username || keys[0];
                                if (foundNick) break;
                            }
                        }
                    }
                }
            }
        }

        if (!foundNick) {
            try {
                for (let i = 0; i < localStorage.length; i++) {
                    let key = localStorage.key(i);
                    if (key.includes('user') || key.includes('account') || key.includes('nick') || key.includes('profile')) {
                        let val = localStorage.getItem(key);
                        if (val && val.length < 30 && !val.startsWith('{')) {
                            foundNick = val;
                            break;
                        }
                    }
                }
            } catch(e) {}
        }

        if (!foundNick) foundNick = 'papkavansa';

        let trans = transliterate(String(foundNick));
        let cleanName = trans.toLowerCase().replace(/[^a-z0-9-_]/g, '_');
        if (cleanName.length < 3) cleanName = 'user_' + cleanName;

        let randomSuffix = Math.floor(1000 + Math.random() * 9000);
        return `${cleanName}_${randomSuffix}`;
    }

    window.initPeerNode = function() {
        if (typeof Peer === 'undefined') {
            appendSystemLog('> Ошибка: Библиотека PeerJS не найдена!');
            return;
        }

        if (peer) {
            try { peer.destroy(); } catch(e) {}
            peer = null;
        }

        const customId = fetchNicknameFromUserBase();
        appendSystemLog(`> Сканирование User Base... Адрес: ${customId}`);

        try {
            peer = new Peer(customId);

            peer.on('open', (myId) => {
                const idSpan = document.getElementById('svyaz-my-id');
                if (idSpan) {
                    idSpan.innerText = myId;
                    idSpan.style.color = '#58a6ff';
                }
                appendSystemLog(`> Успешно! Сетевой узел зарегистрирован: ${myId}`);
            });

            peer.on('connection', (conn) => {
                setupConnection(conn);
                appendSystemLog(`> Входящее подключение от: ${conn.peer}`);
            });

            peer.on('call', (call) => {
                showIncomingCallModal(call);
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    appendSystemLog('> Имя занято в сети, повторный поиск в базе...');
                    setTimeout(() => window.initPeerNode(), 1000);
                } else {
                    appendSystemLog(`> Ошибка сети: ${err.type}`);
                }
            });
        } catch(e) {
            appendSystemLog(`> Ошибка инициализации Peer: ${e.message}`);
        }
    };

    function setupConnection(conn) {
        currentConnection = conn;

        conn.on('open', () => {
            appendSystemLog(`> Связь установлена с узлом: ${conn.peer}`);
        });

        conn.on('data', (data) => {
            if (typeof data === 'string') {
                appendChatMessage('Абонент', data, '#3fb950');
            } else if (data && data.type === 'file') {
                const blob = new Blob([data.buffer], { type: data.fileType });
                const url = URL.createObjectURL(blob);
                appendFileMessage('Абонент', data.name, url, data.fileType, '#3fb950');
            } else if (data && data.type === 'voice') {
                const blob = new Blob([data.buffer], { type: 'audio/webm' });
                const url = URL.createObjectURL(blob);
                appendVoiceMessage('Абонент', url, '#3fb950');
            }
        });

        conn.on('close', () => {
            appendSystemLog('> Соединение закрыто абонентом.');
            currentConnection = null;
        });
    }

    function startCall(targetId) {

                <button id="svyaz-end-call" style="background:#da3633; border:none; color:#fff; padding:8px 16px; border-radius:4px; cursor:pointer; font-weight:bold;">Положить трубку</button>

        }

        camBtn.onclick = () => {
            if (localStream) {
                camActive = !camActive;
                localStream.getVideoTracks().forEach(track => track.enabled = camActive);
                camBtn.innerText = camActive ? '📹 Камера: ВКЛ' : '📹 Камера: ВЫКЛ';
                camBtn.style.background = camActive ? '#238636' : '#21262d';

        };

        callUi.querySelector('#svyaz-end-call').onclick = () => {
            if (currentCall) currentCall.close();

        };

    function closeActiveCallUI() {

        if (callUi) callUi.remove();
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
        }
        remoteStream = null;
        currentCall = null;
    }

    function appendSystemLog(text) {
        const box = document.getElementById('svyaz-chat-box');
        if (!box) return;
        box.innerHTML += `<div style="color:#8b949e; font-style:italic;">${text}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    function appendChatMessage(sender, text, color) {
        const box = document.getElementById('svyaz-chat-box');
        if (!box) return;
        box.innerHTML += `<div><strong style="color:${color};">${sender}:</strong> ${text}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    function appendFileMessage(sender, fileName, fileUrl, fileType, color) {
        const box = document.getElementById('svyaz-chat-box');
        if (!box) return;
        let contentHtml = '';
        if (fileType && fileType.startsWith('image/')) {
            contentHtml = `<br><img src="${fileUrl}" style="max-width:150px; max-height:150px; border-radius:4px; margin-top:4px;">`;
        } else {
            contentHtml = `<br><a href="${fileUrl}" download="${fileName}" style="color:#58a6ff; text-decoration:underline;">📥 ${fileName}</a>`;
        }
        box.innerHTML += `<div><strong style="color:${color};">${sender} прикрепил файл:</strong> ${contentHtml}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    function appendVoiceMessage(sender, audioUrl, color) {
        const box = document.getElementById('svyaz-chat-box');
        if (!box) return;
        box.innerHTML += `<div><strong style="color:${color};">${sender} (голосовое):</strong><br><audio controls src="${audioUrl}" style="height:30px; margin-top:4px;"></audio></div>`;
        box.scrollTop = box.scrollHeight;
    }

    setInterval(() => {
        const win = document.getElementById(`w-${id}`);
        if (!win) return;

        const hdrSpan = win.querySelector('.win-hdr span') || win.querySelector('span');
        if (hdrSpan && hdrSpan.innerText !== "📡 Связь — Сетевой узел") {
            hdrSpan.innerText = "📡 Связь — Сетевой узел";
        }

        if (!win.querySelector('#svyaz-chat-box')) {
            let bodyBox = win.querySelector('.win-box') || win;
            
            const oldTxt = win.querySelector('textarea');
            if (oldTxt) oldTxt.remove();

            const svyazUI = document.createElement('div');
            svyazUI.style.cssText = "padding:12px; display:flex; flex-direction:column; flex:1; gap:10px; overflow:hidden; font-family:inherit; font-size:12px; width:100%; height:calc(100% - 35px); box-sizing:border-box; background:#0d1117; color:#c9d1d9; position:relative;";
            
            const blackInputStyle = "background:#161b22; border:1px solid #30363d; color:#fff; padding:6px 10px; flex:1; border-radius:4px; font-family:inherit; font-size:12px; outline:none;";
            const blackBtnStyle = "background:#21262d; border:1px solid #30363d; color:#c9d1d9; padding:6px 12px; cursor:pointer; border-radius:4px; font-family:inherit; font-size:12px; font-weight:bold; transition: background 0.2s;";

            svyazUI.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; background:#161b22; border:1px solid #30363d; padding:6px 10px; border-radius:4px; user-select:none;">
                    <div>Адрес ЭВМ: <span id="svyaz-my-id" style="font-weight:bold; color:#f85149;">Сканирование базы...</span></div>
                    <div style="display:flex; gap:4px;">
                        <button id="svyaz-reconnect-btn" style="${blackBtnStyle} padding:3px 6px; font-size:11px;" title="Пересоздать ID из базы">🔄</button>
                        <button id="svyaz-copy-btn" style="${blackBtnStyle} padding:3px 8px; font-size:11px;">Копировать</button>
                    </div>
                </div>
                
                <div style="display:flex; gap:6px;">
                    <input type="text" id="svyaz-target-input" placeholder="Введите адрес удаленной ЭВМ..." style="${blackInputStyle}">
                    <button id="svyaz-connect-btn" style="${blackBtnStyle} background:#238636; color:#fff; border:none;" title="Подключить текст">Вызывать</button>
                    <button id="svyaz-call-btn" style="${blackBtnStyle} background:#1f6feb; color:#fff; border:none;" title="Позвонить абоненту">📞 Звонок</button>
                </div>
                
                <div id="svyaz-chat-box" style="flex:1; background:#161b22; border:1px solid #30363d; padding:10px; overflow-y:auto; border-radius:4px; display:flex; flex-direction:column; gap:6px; box-shadow:inset 0 2px 4px rgba(0,0,0,0.5); color:#c9d1d9; font-family:monospace;">
                    <div style="color:#8b949e; font-style:italic;">> Запуск сетевого модуля...</div>
                </div>
                
                <input type="file" id="svyaz-file-input" style="display:none;">

                <div style="display:flex; gap:6px; align-items:center;">
                    <input type="text" id="svyaz-text-input" placeholder="Введите текст сообщения..." style="${blackInputStyle} padding:8px 10px;">
                    <button id="svyaz-send-btn" style="${blackBtnStyle} color:#58a6ff; padding:8px 14px;">Отправить</button>
                    
                    <button id="svyaz-file-btn" class="svyaz-media-btn" style="${blackBtnStyle} padding:8px 10px;" title="Прикрепить файл">📎 Файл</button>
                    <button id="svyaz-voice-btn" class="svyaz-media-btn" style="${blackBtnStyle} padding:8px 10px;" title="Записать голос">🎤 Голос</button>
                </div>
            `;
            bodyBox.appendChild(svyazUI);

            setTimeout(() => { window.initPeerNode(); }, 100);

            const reconBtn = win.querySelector('#svyaz-reconnect-btn');
            if (reconBtn) {
                reconBtn.onclick = () => window.initPeerNode();
            }

            const copyBtn = win.querySelector('#svyaz-copy-btn');
            if (copyBtn) {
                copyBtn.onclick = () => {
                    const myIdText = document.getElementById('svyaz-my-id').innerText;
                    navigator.clipboard.writeText(myIdText).then(() => {
                        copyBtn.innerText = 'Готово!';
                        setTimeout(() => copyBtn.innerText = 'Копировать', 2000);
                    });
                };
            }

            const connectBtn = win.querySelector('#svyaz-connect-btn');
            const targetInput = win.querySelector('#svyaz-target-input');
            if (connectBtn && targetInput) {
                connectBtn.onclick = () => {
                    const targetId = targetInput.value.trim();
                    if (!targetId) return;
                    if (!peer) { alert('Узел не запущен!'); return; }
                    appendSystemLog(`> Подключение к тексту ${targetId}...`);
                    const conn = peer.connect(targetId);
                    setupConnection(conn);
                };
            }

            const callBtn = win.querySelector('#svyaz-call-btn');
            if (callBtn && targetInput) {
                callBtn.onclick = () => {
                    const targetId = targetInput.value.trim();
                    if (!targetId) { alert('Введите адрес абонента для звонка!'); return; }
                    startCall(targetId);
                };
            }

            const fileBtn = win.querySelector('#svyaz-file-btn');
            const fileInput = win.querySelector('#svyaz-file-input');
            if (fileBtn && fileInput) {
                fileBtn.onclick = () => fileInput.click();
                fileInput.onchange = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    if (!currentConnection || !currentConnection.open) {
                        alert('Нет активного соединения для передачи файла!');
                        return;
                    }
                    
                    appendSystemLog('> Подготовка файла к отправке...');
                    file.arrayBuffer().then(buffer => {
                        const fileData = {
                            type: 'file',
                            name: file.name,
                            fileType: file.type,
                            buffer: buffer
                        };
                        currentConnection.send(fileData);
                        const localUrl = URL.createObjectURL(file);
                        appendFileMessage('Вы', file.name, localUrl, file.type, '#58a6ff');
                        appendSystemLog('> Файл успешно отправлен.');
                    }).catch(err => {
                        alert('Ошибка чтения файла: ' + err.message);
                    });
                };
            }

            const voiceBtn = win.querySelector('#svyaz-voice-btn');
            let isRecording = false;
            if (voiceBtn) {
                voiceBtn.onclick = () => {
                    if (!isRecording) {
                        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                            mediaRecorder = new MediaRecorder(stream);
                            audioChunks = [];
                            mediaRecorder.ondataavailable = event => {
                                if (event.data && event.data.size > 0) {
                                    audioChunks.push(event.data);
                                }
                            };
                            mediaRecorder.onstop = () => {
                                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                                audioBlob.arrayBuffer().then(buffer => {
                                    if (currentConnection && currentConnection.open) {
                                        currentConnection.send({ type: 'voice', buffer: buffer });
                                        appendSystemLog('> Голосовое сообщение отправлено.');
                                    } else {
                                        alert('Нет соединения для отправки голоса!');
                                    }
                                    const audioUrl = URL.createObjectURL(audioBlob);
                                    appendVoiceMessage('Вы', audioUrl, '#58a6ff');
                                });
                                stream.getTracks().forEach(track => track.stop());
                            };
                            mediaRecorder.start();
                            isRecording = true;
                            voiceBtn.innerText = '⏹ Стоп голос';
                            voiceBtn.style.background = '#da3633';
                            appendSystemLog('> Идет запись голоса...');
                        }).catch(err => {
                            alert('Ошибка микрофона: ' + err.message);
                        });
                    } else {
                        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                            mediaRecorder.stop();
                        }
                        isRecording = false;
                        voiceBtn.innerText = '🎤 Голос';
                        voiceBtn.style.background = '#21262d';
                    }
                };
            }

            const box = win.querySelector('#svyaz-chat-box');
            const inp = win.querySelector('#svyaz-text-input');
            const sendBtn = win.querySelector('#svyaz-send-btn');
            
            if (sendBtn && inp && box) {
                const performSend = () => {
                    const text = inp.value.trim();
                    if (!text) return;

                    if (currentConnection && currentConnection.open) {
                        currentConnection.send(text);
                        appendChatMessage('Вы', text, '#58a6ff');
                        inp.value = '';
                    } else {
                        alert('Нет активного сетевого соединения!');
                    }
                };

                sendBtn.onclick = performSend;
                inp.onkeydown = (e) => { if (e.key === 'Enter') performSend(); };
            }
        }
    }, 40);
})();
(function() {

    // 1. ПЕРЕХВАТ ЗАПУСКА ДЛЯ УВЕЛИЧЕНИЯ СТАРТОВОГО РАЗМЕРА ОКНА
    const baseOpenAppForPaintSize = openApp;
    openApp = function(id) {
        // Даем штатному движку создать окно приложения
        baseOpenAppForPaintSize(id);
        
        // Если открылось именно приложение Изо (paint)
        if (id === 'paint') {
            setTimeout(() => {
                const win = wins['paint'];
                if (!win) return;

                // Задаем увеличенный комфортный размер (720x520px вместо 500x380px)
                win.style.width = '720px';
                win.style.height = '520px';

                // Красиво центрируем окно по центру экрана ЭВМ Электроника-11
                win.style.left = Math.floor((window.innerWidth - 720) / 2) + 'px';
                win.style.top = Math.floor((window.innerHeight - 520) / 2) + 'px';

                // Принудительно вызываем адаптивный рендер холста
                if (window.resizePaintCanvas) {
                    window.resizePaintCanvas(win);
                }
            }, 60); // Небольшая задержка, чтобы DOM-структура успела создаться
        }
    };

    // 2. ФУНКЦИЯ ДИНАМИЧЕСКОЙ АДАПТАЦИИ ХОЛСТА ПРИ РАСТЯГИВАНИИ ОКНА
    window.resizePaintCanvas = function(win) {
        if (!win) return;
        const canv = win.querySelector('#canv');
        const box = win.querySelector('.win-box');
        const bar = win.querySelector('.paint-bar');
        if (!canv || !box) return;

        // Вычисляем доступную высоту (высота окна минус высота панели инструментов)
        const barHeight = bar ? bar.offsetHeight : 35;
        const targetWidth = box.clientWidth;
        const targetHeight = box.clientHeight - barHeight;

        // Если размеры не изменились — пропускаем, чтобы не дергать холст
        if (canv.width === targetWidth && canv.height === targetHeight) return;

        // СУПЕР-ХАК: Сохраняем текущий рисунок пользователя во временную память перед ресайзом
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = canv.width;
        tempCanvas.height = canv.height;
        const tempCtx = tempCanvas.getContext('2d');
        if (tempCtx) {
            tempCtx.drawImage(canv, 0, 0);
        }

        // Жестко синхронизируем внутреннее разрешение Canvas с его реальным CSS-размером в DOM
        canv.width = targetWidth;
        canv.height = targetHeight;
        canv.style.width = targetWidth + 'px';
        canv.style.height = targetHeight + 'px';

        // Заливаем новый холст стандартным фоном (белый для светлой темы, темно-серый для темной)
        const cx = canv.getContext('2d');
        if (cx) {
            cx.fillStyle = document.body.classList.contains('light') ? '#ffffff' : '#1e1e1e';
            cx.fillRect(0, 0, canv.width, canv.height);
            
            // Возвращаем рисунок пользователя обратно на холст без потерь и искажений
            cx.drawImage(tempCanvas, 0, 0);
        }
    };

    // 3. АВТОНОМНЫЙ НАБЛЮДАТЕЛЬ ЗА ИЗМЕНЕНИЕМ ГАБАРИТОВ ОКНА
    document.addEventListener('DOMNodeInserted', function(e) {
        const win = e.target;
        if (win && win.classList && win.classList.contains('window') && win.id === 'w-paint') {
            // Создаем ResizeObserver, который мгновенно реагирует на растягивание окна мышкой
            const ro = new ResizeObserver(() => {
                if (window.resizePaintCanvas) {
                    window.resizePaintCanvas(win);
                }
            });
            ro.observe(win);
            win.style.setProperty('display', 'flex', 'important');
            win.style.setProperty('flex-direction', 'column', 'important');
        }
    });
})();
(function() {

    // ПОЛНАЯ ПЕРЕЗАПИСЬ ФУНКЦИИ ИНИЦИАЛИЗАЦИИ РИСОВАНИЯ
    window.initPaint = function(cn, cl, sz, er) {
        const cx = cn.getContext('2d');
        if (!cx) return;
        let d = false;

        // Корректный расчет координат мыши с учетом масштабирования Canvas в CSS
        const getPos = (e) => {
            const rect = cn.getBoundingClientRect();
            return {
                // Вычисляем точную пропорцию физического пикселя к его отображению на экране
                x: (e.clientX - rect.left) * (cn.width / rect.width),
                y: (e.clientY - rect.top) * (cn.height / rect.height)
            };
        };

        // Нажатие мыши — начинаем линию
        cn.onmousedown = (e) => {
            if (e.button !== 0) return; // Только левая кнопка мыши
            d = true;
            const p = getPos(e);
            cx.beginPath();
            cx.moveTo(p.x, p.y);
        };

        // Движение мыши — рисуем или стираем
        cn.onmousemove = (e) => {
            if (!d) return;
            const p = getPos(e);
            cx.lineWidth = sz ? sz.value : 3;
            cx.lineCap = 'round';
            cx.lineJoin = 'round';

            // Проверяем, активен ли ластик в данный момент
            if (er && er.classList.contains('active')) {
                // Ластик красит под цвет фона текущей темы системы ЭВМ
                cx.strokeStyle = document.body.classList.contains('light') ? '#ffffff' : '#1e1e1e';
            } else {
                // Иначе красим выбранным в палитре цветом
                cx.strokeStyle = cl ? cl.value : '#ff0000';
            }

            cx.lineTo(p.x, p.y);
            cx.stroke();
        };

        // Отпускание или уход мыши с холста — прекращаем рисование
        cn.onmouseup = () => { d = false; };
        cn.onmouseleave = () => { d = false; };

        // Изолированный клик по ластику — только переключает его класс активности
        if (er) {
            er.onclick = (e) => {
                e.preventDefault();
                e.stopPropagation();
                er.classList.toggle('active');
            };
        }
    };
})();
