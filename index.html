<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><title>ЭВМ Электроника-11</title>
<style>
    /* Стили для поиска и размеров меню Пуск */
    #e11-search-wrapper { grid-column: 1 / -1; margin-bottom: 10px; display: flex; flex-direction: column; gap: 5px; }
    #e11-global-search { width: 100%; padding: 7px; background: rgba(0,0,0,0.3); border: 1px solid var(--panel-border); color: #fff; border-radius: 4px; outline: none; font-size: 11px; }
    #e11-search-results { display: none; flex-direction: column; gap: 4px; max-height: 120px; overflow-y: auto; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); }
</style>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>
window.addEventListener('DOMContentLoaded', () => {
    // 1. Перехват клавиши Windows (открывает Пуск на сайте вместо вашей ОС)
    window.addEventListener('keydown', function(e) {
        if (e.key === 'Meta' || e.key === 'OS' || e.code === 'OSLeft' || e.code === 'OSRight') {
            e.preventDefault();
            e.stopPropagation();
            const startMenu = document.getElementById('start');
            if (startMenu) {
                startMenu.classList.toggle('open');
                const searchInp = document.getElementById('e11-global-search');
                if (startMenu.classList.contains('open') && searchInp) {
                    setTimeout(() => searchInp.focus(), 50);
                }
            }
        }
    }, true);

    // 2. Интеграция поиска и размеров в меню Пуск
    const oldBuildStartMenu = typeof buildStartMenu === 'function' ? buildStartMenu : function(){};
    buildStartMenu = function() {
        oldBuildStartMenu();
        const start = document.getElementById('start');
        if (!start) return;

        let oldSearch = document.getElementById('e11-search-wrapper');
        if (oldSearch) oldSearch.remove();

        const searchWrapper = document.createElement('div');
        searchWrapper.id = 'e11-search-wrapper';
        searchWrapper.innerHTML = `
            <input type="text" id="e11-global-search" placeholder="🔍 Поиск приложений и файлов..." autocomplete="off">
            <div id="e11-search-results"></div>
        `;
        start.insertBefore(searchWrapper, start.firstChild);

        const searchInput = document.getElementById('e11-global-search');
        const searchResBox = document.getElementById('e11-search-results');

        searchInput.oninput = function(e) {
            e.stopPropagation();
            const query = searchInput.value.trim().toLowerCase();
            searchResBox.innerHTML = '';
            if (!query) {
                searchResBox.style.display = 'none';
                return;
            }

            searchResBox.style.display = 'flex';
            let foundCount = 0;

            const appNames = {
                browser: 'Сеть', settings: 'Опции', store: 'Магазин', explorer: 'Каталог',
                notepad: 'Слово', paint: 'Изо', calc: 'Счёты', tetris: 'Тетрис', flappy: 'Птица'
            };

            if (typeof activeApps !== 'undefined') {
                activeApps.forEach(appId => {
                    let name = appNames[appId] || appId;
                    if (name.toLowerCase().includes(query) || appId.toLowerCase().includes(query)) {
                        foundCount++;
                        let item = document.createElement('div');
                        item.style.cssText = "padding: 4px 6px; font-size: 11px; cursor: pointer; background: rgba(255,255,255,0.05); border-radius: 3px; color: #fff; display: flex; align-items: center; gap: 6px;";
                        item.innerHTML = `<span>${icons[appId] || '💻'}</span> <span>Приложение: <b>${name}</b></span>`;
                        item.onclick = () => {
                            if (typeof openApp === 'function') openApp(appId);
                            start.classList.remove('open');
                        };
                        searchResBox.appendChild(item);
                    }
                });
            }

            if (typeof vfs !== 'undefined' && Array.isArray(vfs)) {
                vfs.filter(f => f.user === currentUser).forEach(file => {
                    if (file.name.toLowerCase().includes(query)) {
                        foundCount++;
                        let item = document.createElement('div');
                        item.style.cssText = "padding: 4px 6px; font-size: 11px; cursor: pointer; background: rgba(255,255,255,0.05); border-radius: 3px; color: #fff; display: flex; align-items: center; gap: 6px;";
                        let fileIcon = file.type === 'image' ? '🖼️' : '📄';
                        item.innerHTML = `<span>${fileIcon}</span> <span>Файл: <b>${file.name}</b></span>`;
                        item.onclick = () => {
                            if (typeof openApp === 'function') openApp(file.type === 'image' ? 'paint' : 'notepad');
                            setTimeout(() => {
                                const win = Object.values(wins).pop();
                                if (win) {
                                    if (file.type === 'image') {
                                        const img = new Image();
                                        img.onload = () => win.querySelector('#canv').getContext('2d').drawImage(img, 0, 0);
                                        img.src = file.content;
                                    } else {
                                        const ntp = win.querySelector('.ntp');
                                        if (ntp) ntp.value = file.content;
                                    }
                                }
                            }, 100);
                            start.classList.remove('open');
                        };
                        searchResBox.appendChild(item);
                    }
                });
            }

            if (foundCount === 0) {
                searchResBox.innerHTML = `<div style="padding: 6px; font-size: 11px; color: #aaa; text-align: center;">Ничего не найдено в системе</div>`;
            }
        };

        const savedSizeMode = localStorage.getItem('e11_start_size_mode') || 'custom';
        applyStartSizeMode(savedSizeMode, false);
    };

    window.applyStartSizeMode = function(mode, save = true) {
        if (save) localStorage.setItem('e11_start_size_mode', mode);
        const start = document.getElementById('start');
        if (!start) return;

        if (mode === 'standard') {
            start.style.width = '450px';
            start.style.height = '340px';
        } else if (mode === 'win11') {
            start.style.width = '640px';
            start.style.height = '480px';
        } else if (mode === 'custom') {
            start.style.width = '450px';
            start.style.height = '340px';
        }
    };

    // 3. Добавление кнопок в настройки (вкладка «Персонализация»)
    const oldGetSettingsContent = typeof getSettingsContent === 'function' ? getSettingsContent : function(){return '';};
    getSettingsContent = function() {
        let baseContent = oldGetSettingsContent();
        if (typeof currentSettingsTab !== 'undefined' && currentSettingsTab === 'view') {
            const currentMode = localStorage.getItem('e11_start_size_mode') || 'custom';
            let extraBlock = `
                <div class="win11-section" style="margin-top: 10px;">
                    <div class="win11-hdr">📏 Размер меню «Пуск»</div>
                    <div style="display: flex; gap: 8px; margin-top: 5px;">
                        <button onclick="applyStartSizeMode('standard'); switchSettingsTab('view');" class="account-btn" style="flex: 1; background: ${currentMode==='standard'?'var(--panel-border)':'#333'}; color: ${currentMode==='standard'?'#000':'#fff'};">Стандартная</button>
                        <button onclick="applyStartSizeMode('win11'); switchSettingsTab('view');" class="account-btn" style="flex: 1; background: ${currentMode==='win11'?'var(--panel-border)':'#333'}; color: ${currentMode==='win11'?'#000':'#fff'};">Большая (Win 11)</button>
                        <button onclick="applyStartSizeMode('custom'); switchSettingsTab('view');" class="account-btn" style="flex: 1; background: ${currentMode==='custom'?'var(--panel-border)':'#333'}; color: ${currentMode==='custom'?'#000':'#fff'};">Пользовательская</button>
                    </div>
                    <span style="font-size: 10px; opacity: 0.7; margin-top: 3px;">* В пользовательском режиме размер можно менять мышкой за границы окна Пуск.</span>
                </div>
            `;
            return baseContent + extraBlock;
        }
        return baseContent;
    };
});
</script>

<script>
let wins={},z=1000,expr='',currCtx='',lastHex='#7d1616',bgMode='0',valAlpha=0.9,winOp=true,tbarOp=true,startOp=true,kgbTimer=30,kgbInterval=null,appStatus={notepad:0,calc:0,paint:0,tetris:0,flappy:0,explorer:2};
let activeApps=[],pinnedApps=['explorer'],currentOsType='full',currentUser='admin';
const icons={browser:'🌐',notepad:'📝',paint:'🎨',calc:'🧮',settings:'⚙️',store:'🛍️',tetris:'🧱',flappy:'🐦',explorer:'📁'};
let pendingBgFileContent = '', currentStartLogo = '☭', currentSettingsTab = 'main';

// Сессионный режим: новые аккаунты полностью сотрутся при закрытии вкладки

function updateLoginSelect() {

function hexToRgb(hex) {
    let r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16);
    return isNaN(r) ? {r:125, g:22, b:22} : {r, g, b};
}
function rgbToHex(r, g, b) { return "#" + [r, g, b].map(x => { const h = Math.max(0, Math.min(255, x)).toString(16); return h.length === 1 ? "0" + h : h; }).join(""); }
function getSmartBorderColor(hexColor) {
    if (!hexColor.startsWith('#')) return '#ffcc00';
    let {r, g, b} = hexToRgb(hexColor), max = Math.max(r, g, b); if (max < 30) return '#ffcc00';
    let kR = r / max, kG = g / max, kB = b / max; let nR = Math.round(kR * 255), nG = Math.round(kG * 255), nB = Math.round(kB * 255);
    if (Math.abs(nR - nG) < 20 && Math.abs(nG - nB) < 20) return '#ffcc00';
    return rgbToHex(nR, nG, nB);
}

    let isL=document.body.classList.contains('light');

let vfs = JSON.parse(sessionStorage.getItem('e11_vfs') || '[]');

function saveFileToVfs(name, content, type = 'text') {
    if (!name.trim()) return alert("Имя файла не может быть пустым!");
    const userKey = currentUser + "_" + name;
    const existing = vfs.findIndex(f => f.userKey === userKey);
    if (existing !== -1) {
        if (!confirm("Файл с таким именем существует. Перезаписать?")) return false;
        vfs[existing].content = content; vfs[existing].type = type;
    } else {
        vfs.push({ userKey: userKey, name: name, content: content, type: type, user: currentUser });
    }
    sessionStorage.setItem('e11_vfs', JSON.stringify(vfs));
    renderExplorer();
    return true;
}

function renderExplorer() {
    const box = document.getElementById('exp-view'); if (!box) return; box.innerHTML = '';
    const userFiles = vfs.filter(f => f.user === currentUser);
    if (userFiles.length === 0) { box.innerHTML = '<div style="font-size:11px;opacity:0.5;padding:10px;grid-column:1/-1;">Каталог пуст</div>'; return; }
    userFiles.forEach((file) => {
        const item = document.createElement('div'); item.className = 'exp-file';
        const icon = file.type === 'image' ? '🖼️' : '📄';
        item.innerHTML = `<div>${icon}</div><span>${file.name}</span>`;
        item.onclick = () => {
            if (file.type === 'image') {
                openApp('paint');
                setTimeout(() => {
                    const win = wins['paint'];
                    if (win) {
                        const canv = win.querySelector('#canv'); const img = new Image();
                        img.onload = () => { const cx = canv.getContext('2d'); cx.clearRect(0, 0, canv.width, canv.height); cx.drawImage(img, 0, 0); };
                        img.src = file.content;
                        const title = win.querySelector('.win-hdr span'); if (title) title.innerText = `🎨 Изо - ${file.name}`;
                    }
                }, 50);
            } else {
                openApp('notepad');
                setTimeout(() => {
                    const win = wins['notepad']; if (win) { win.querySelector('.ntp').value = file.content; const title = win.querySelector('.win-hdr span'); if (title) title.innerText = `📝 Слово - ${file.name}`; }

        };

    });
}

// Функция создания всплывающего окна удаления прямо по центру экрана
function startAutonomousUninstall(id) {
    let lbl = id==='notepad'?'Слово':id==='paint'?'Изо':id==='calc'?'Счёты':id==='tetris'?'Тетрис':'Птица';
    
    // Создаем фон-затемнение на весь экран
    const overlay = document.createElement('div');
    overlay.style.cssText = "position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.6); z-index:9999999; display:flex; align-items:center; justify-content:center; font-family:monospace; user-select:none;";
    
    // Создаем карточку прогресса удаления
    overlay.innerHTML = `
        <div style="background:#222; border:2px solid #ff5f56; padding:20px; border-radius:8px; width:280px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.7); color:#fff;">
            <div style="font-size:14px; font-weight:bold; color:#ff5f56; margin-bottom:10px;">🛑 ДЕИНСТАЛЛЯЦИЯ</div>
            <div style="font-size:12px; margin-bottom:12px;">Удаление программы: <b>${lbl}</b></div>
            <!-- Полоса загрузки в стиле Магазина -->
            <div style="width:100%; background:rgba(255,255,255,0.1); height:8px; border-radius:4px; overflow:hidden; margin-bottom:5px;">
                <div id="auto-pbar" style="height:100%; width:0%; background:#ff5f56; transition:width 0.1s linear;"></div>
            </div>
            <div id="auto-txt" style="font-size:10px; color:#888;">Очистка файлов конфигурации...</div>
        </div>
    `;
    
    document.body.appendChild(overlay);
    
    const pbar = overlay.querySelector('#auto-pbar');
    const txt = overlay.querySelector('#auto-txt');
    let progress = 0;
    
    // Процесс удаления длится 3 секунды (30 тиков по 100мс)
    let interval = setInterval(() => {
        progress += 3.4;
        if (progress > 100) progress = 100;
        pbar.style.width = `${progress}%`;
        
        if(progress > 40 && progress < 80) txt.innerText = "Освобождение дискового пространства...";
        if(progress >= 80) txt.innerText = "Стирание системных ярлыков...";
        
        if (progress >= 100) {
            clearInterval(interval);
            
            // 1. Закрываем само приложение, если оно было открыто
            if (typeof closeApp === 'function') closeApp(id);
            
            // 2. Стираем все ярлыки с Рабочего стола и меню Пуск
            document.getElementById(`i-${id}`)?.remove();
            document.getElementById(`s-${id}`)?.remove();
            
            // 3. Вычищаем приложение из списка запущенных
            activeApps = activeApps.filter(a => a !== id);
            
            // 4. Тихо меняем статус в базе данных (в Магазине текст сам поменяется на "Скачать" при его открытии)
            if (appStatus[id] !== undefined) appStatus[id] = 0;
            
            // 5. Обновляем сетку и панель задач
            if (typeof initIcos === 'function') initIcos();
            if (typeof renderTaskbar === 'function') renderTaskbar();
            
            // Убираем окно удаления с экрана
            setTimeout(() => {
                overlay.remove();
                alert(`ПРИЛОЖЕНИЕ "${lbl.toUpperCase()}" УСПЕШНО УДАЛЕНО!`);
            }, 300);
        }
    }, 100);

// УЛЬТРА-ФИКС: ЗАЩИТА ОТ НАЛОЖЕНИЯ ИКОНОК ДРУГ НА ДРУГА
// ==========================================
document.getElementById('desk').addEventListener('mouseup', function(e) {
    // Ждем 10 миллисекунд, чтобы твоя родная функция dragIco завершила перемещение ярлыка
    setTimeout(() => {
        const allIcons = Array.from(document.querySelectorAll('.desktop .ico'));
        if (allIcons.length <= 1) return;

        // Функция поиска первой попавшейся свободной ячейки на Рабочем столе
        function findFreeGridCell() {
            let col = 0, row = 0;
            while (true) {
                let checkLeft = 20 + col * 90;
                let checkTop = 20 + row * 90;
                
                // Проверяем, не занята ли эта координата каким-либо ярлыком
                let isCellOccupied = allIcons.some(ico => {
                    return parseInt(ico.style.left) === checkLeft && parseInt(ico.style.top) === checkTop;
                });

                if (!isCellOccupied) {
                    return { left: checkLeft, top: checkTop };
                }

                // Идем по сетке сверху вниз, слева направо (как в функции initIcos)
                row++;
                if (row > 4) { row = 0; col++; }
                
                // Страховка от бесконечного цикла, если рабочий стол переполнен
                if (col > 20) return { left: 20, top: 20 };
            }
        }

// 2. Логика мыши для рисования рамки на Рабочем столе
document.getElementById('desk').addEventListener('mousedown', function(e) {
    // Включаем только если кликнули по пустому месту стола левой кнопкой
    if (e.target !== this || e.button !== 0) return;
    
    // Сбрасываем старое выделение
    document.querySelectorAll('.desktop .ico').forEach(i => i.classList.remove('selected-folder'));
    
    let box = document.getElementById('screen-selector');
    if (!box) { 
        box = document.createElement('div'); 
        box.id = 'screen-selector'; 
        box.className = 'selection-box'; 
        this.appendChild(box); 
    }
    
    let currentBorder = getComputedStyle(document.documentElement).getPropertyValue('--panel-border').trim();
    box.style.backgroundColor = currentBorder.startsWith('#') ? currentBorder + '25' : 'rgba(255,204,0,0.15)';

    const startX = e.clientX - this.getBoundingClientRect().left;
    const startY = e.clientY - this.getBoundingClientRect().top;
    box.style.left = startX + 'px'; box.style.top = startY + 'px'; box.style.width = '0px'; box.style.height = '0px'; box.style.display = 'block';
    
    const onMouseMove = (me) => {
        const currentX = me.clientX - this.getBoundingClientRect().left;
        const currentY = me.clientY - this.getBoundingClientRect().top;
        const x = Math.min(startX, currentX), y = Math.min(startY, currentY);
        const w = Math.abs(startX - currentX), h = Math.abs(startY - currentY);
        box.style.left = x + 'px'; box.style.top = y + 'px'; box.style.width = w + 'px'; box.style.height = h + 'px';
        
        const boxRect = box.getBoundingClientRect();
        document.querySelectorAll('.desktop .ico').forEach(ico => {
            const icoRect = ico.getBoundingClientRect();
            const isColliding = !(boxRect.right < icoRect.left || boxRect.left > icoRect.right || boxRect.bottom < icoRect.top || boxRect.top > icoRect.bottom);
            if (isColliding) ico.classList.add('selected-folder'); else ico.classList.remove('selected-folder');
        });
    };
    
    const onMouseUp = () => { 
        box.style.display = 'none'; 
        document.removeEventListener('mousemove', onMouseMove); 
        document.removeEventListener('mouseup', onMouseUp); 
    };
    document.addEventListener('mousemove', onMouseMove); 
    document.addEventListener('mouseup', onMouseUp);
});

// СУПЕР-ХАК: УДАЛЕНИЕ ТЕРМИНАЛА (КОНТЕКСТНОЕ МЕНЮ + DELETE)

const finalCtxFix = typeof showCtx === 'function' ? showCtx : function(){};
showCtx = function(e, id) {
    // Сначала запускаем твое стандартное меню
    finalCtxFix(e, id);
    
    const m = document.getElementById('ctx-menu');
    if (!m) return;

    // Если кликнули правой кнопкой мыши именно по Терминалу
    if (id === 'terminal') {
        // Удаляем старую кнопку, если она была
        const oldDelBtn = document.getElementById('ctx-delete-app');
        if (oldDelBtn) oldDelBtn.remove();

        const delBtn = document.createElement('div');
        delBtn.className = 'ctx-item';
        delBtn.id = 'ctx-delete-app';
        delBtn.style.color = '#ff5f56'; // Красивый красный цвет
        delBtn.style.fontWeight = 'bold';
        delBtn.innerText = 'Удалить приложение';
        
        delBtn.onclick = () => {
            closeCtx();
            // Запускаем наше красивое всплывающее окно удаления для терминала
            if (typeof startAutonomousUninstall === 'function') {
                startAutonomousUninstall('terminal');
            }
        };
        m.appendChild(delBtn);
    }
};

// Перехватываем нажатие клавиши Delete, чтобы она тоже умела стирать Терминал
window.addEventListener('keydown', function(e) {
    if (e.key === 'Delete' || e.key === 'Del') {
        let selectedTerminal = document.querySelector('#i-terminal.selected-folder');
        
        // Если Терминал выделен рамкой и мы нажали Delete
        if (selectedTerminal) {
            // Вызываем для него автономное удаление
            if (typeof startAutonomousUninstall === 'function') {
                startAutonomousUninstall('terminal');
            }
            // Вычеркиваем из автозагрузки, закрываем окно и стираем флаги памяти
            sessionStorage.removeItem('e11_terminal_installed');
            activeApps = activeApps.filter(a => a !== 'terminal');
            if (typeof closeApp === 'function') closeApp('terminal');
            document.getElementById('i-terminal')?.remove();
            document.getElementById('s-terminal')?.remove();
            if (typeof initIcos === 'function') initIcos();
            if (typeof renderTaskbar === 'function') renderTaskbar();
        }
    }
});

// Хак для автономного окна удаления: учим его правильно затирать память Терминала
const originalUninstall = typeof startAutonomousUninstall === 'function' ? startAutonomousUninstall : function(){};
startAutonomousUninstall = function(id) {
    if (id === 'terminal') {
        // Если сносят терминал, подчищаем за ним сессию в памяти ЭВМ
        sessionStorage.removeItem('e11_terminal_installed');
    }
    originalUninstall(id);
};

// МИКРО-ХАК: ПРОЗРАЧНЫЙ ФОН ДЛЯ ОКНА УДАЛЕНИЯ
// ==========================================
const originalStartUninstall = typeof startAutonomousUninstall === 'function' ? startAutonomousUninstall : function(){};

startAutonomousUninstall = function(id) {
    // Запускаем стандартное создание окна
    originalStartUninstall(id);
    
    // Находим созданный оверлей деинсталляции и убираем у него черный фон
    const overlays = document.querySelectorAll('div');
    overlays.forEach(div => {
        // Опознаем наше окно удаления по красному заголовку деинсталляции внутри
        if (div.innerHTML.includes('🛑 ДЕИНСТАЛЛЯЦИЯ') && div.style.position === 'fixed') {
            // ИСПРАВЛЕНО: Меняем rgba(0,0,0,0.6) на полностью прозрачный transparent
            div.style.background = 'transparent';
            // Добавим легкое размытие заднего плана (blur), чтобы карточка смотрелась очень стильно
            div.style.backdropFilter = 'blur(3px)';
            div.style.webkitBackdropFilter = 'blur(3px)';
        }
    });
};

// 1. ПЕРЕЗАПИСЫВАЕМ ФУНКЦИЮ ОБНОВЛЕНИЯ ЭКРАНА ВХОДА
updateLoginSelect = function() {
    const sel = document.getElementById('login-user');
    const loginScr = document.getElementById('login-scr');
    if (!sel || !loginScr) return;

    const userCount = Object.keys(usersBase).length;
    const titleEl = loginScr.querySelector('.block-title');

    if (userCount === 0) {
        // Если база пуста — перестраиваем интерфейс под РЕГИСТРАЦИЮ
        if (titleEl) titleEl.innerText = "📝 РЕГИСТРАЦИЯ СИСТЕМЫ ЭВМ";
        
        // Меняем подпись над полем
        const labelName = sel.previousElementSibling;
        if (labelName) labelName.innerText = "ПРИДУМАЙТЕ ИМЯ АДМИНИСТРАТОРА:";

        // ПРЯЧЕМ СЕЛЕКТ И СТАВИМ ТЕКСТОВЫЙ ИНПУТ (если его еще нет)
        let textInp = document.getElementById('login-user-text');
        if (!textInp) {
            textInp = document.createElement('input');
            textInp.type = 'text';
            textInp.id = 'login-user-text';
            textInp.className = 'login-input';
            textInp.placeholder = "ИМЯ ДЛЯ ВХОДА";
            sel.parentNode.insertBefore(textInp, sel);
        }
        sel.style.display = 'none';
        textInp.style.display = 'block';

        const btn = loginScr.querySelector('.login-btn');
        if (btn) btn.innerText = "СОЗДАТЬ И ВОЙТИ";
    } else {
        // Если пользователи есть — возвращаем стандартный режим ВХОДА
        if (titleEl) titleEl.innerText = "🔑 ВХОД В СИСТЕМУ ЭВМ";
        
        const labelName = sel.previousElementSibling;
        if (labelName) labelName.innerText = "ПОЛЬЗОВАТЕЛЬ:";

        let textInp = document.getElementById('login-user-text');
        if (textInp) textInp.style.display = 'none';
        
        sel.style.display = 'block';
        sel.innerHTML = '';
        
        Object.keys(usersBase).forEach(u => {
            let roleBadge = usersBase[u].isAdmin ? '⭐ ' : '👤 ';
            let title = u === 'admin' ? '👤 Администратор' : roleBadge + u;
            sel.innerHTML += `<option value="${u}">${title}</option>`;
        });

        const btn = loginScr.querySelector('.login-btn');
        if (btn) btn.innerText = "АВТОРИЗАЦИЯ";
    }
};

// 2. ПЕРЕЗАПИСЫВАЕМ ФУНКЦИЮ КНОПКИ LOGIN ДЛЯ СТАРТОВОЙ РЕГИСТРАЦИИ
checkLogin = function() {
    const sel = document.getElementById('login-user');
    const textInp = document.getElementById('login-user-text');
    const pwdInp = document.getElementById('login-pwd');
    if (!pwdInp) return;

    const p = pwdInp.value;
    const userCount = Object.keys(usersBase).length;

    if (userCount === 0) {
        // ЛОГИКА РЕГИСТРАЦИИ ПЕРВОГО ЮЗЕРА
        if (!textInp) return;
        const u = textInp.value.trim();

        if (!u || !p.trim()) {
            alert("ИМЯ И ПАРОЛЬ НЕ МОГУТ БЫТЬ ПУСТЫМИ!");
            return;
        }

        // Создаем первого пользователя и НАВЕЧНО зашиваем ему права СУПЕРАДМИНА
        usersBase[u] = {
            pwd: p.trim(),
            isAdmin: true
        };
        sessionStorage.setItem('e11_users2', JSON.stringify(usersBase));
        alert(`АДМИНИСТРАТОР [${u.toUpperCase()}] УСПЕШНО ЗАРЕГИСТРИРОВАН!\nДобро пожаловать в Электроника-11.`);
        
        currentUser = u;
        document.getElementById('login-scr').style.display = 'none';
        buildDesktop();
        chCustom('#7d1616');
    } else {
        // СТАНДАРТНАЯ ЛОГИКА АВТОРИЗАЦИИ ДЛЯ ПОСЛЕДУЮЩИХ РАЗОВ
        const u = sel.value;
        if(usersBase[u] && usersBase[u].pwd === p) {
            currentUser = u;
            document.getElementById('login-scr').style.display='none';
            buildDesktop();
            const savedBg = sessionStorage.getItem('e11_custom_bg_' + currentUser) || sessionStorage.getItem('e11_custom_bg_global') || '#7d1616';
            bgMode = sessionStorage.getItem('e11_bg_mode_' + currentUser) || '0';
            chCustom(savedBg);
        } else { 
            alert("КЛЮЧ ДОСТУПА НЕПРИНЯТ СИСТЕМОЙ!"); 
        }
    }
};

// 2. ФУНКЦИЯ БЕЗОПАСНОГО УДАЛЕНИЯ АККАУНТА
function deleteAccountFromSettings(username) {
    if (!username || !usersBase[username]) return;
    
    // Считываем имя главного создателя из памяти
    const trueSuperAdmin = localStorage.getItem('e11_super_admin_owner');
    
    if (username === trueSuperAdmin) {
        alert("ОТКАЗ ЯДРА: УДАЛЕНИЕ СУПЕРАДМИНИСТРАТОРА ЗАБЛОКИРОВАНА ВНУТРЕННЕЙ ЗАЩИТОЙ!");
        return;
    }
    
    if (confirm(`ВНИМАНИЕ! Вы действительно хотите безвозвратно удалить пользователя [${username.toUpperCase()}] из базы данных ЭВМ?`)) {
        delete usersBase[username];
        sessionStorage.setItem('e11_users2', JSON.stringify(usersBase));
        
        if (typeof updateLoginSelect === 'function') updateLoginSelect();
        alert(`ПОЛЬЗОВАТЕЛЬ ${username.toUpperCase()} УСПЕШНО СТЕРТ ИЗ ПАМЯТИ.`);
        
        if (username === currentUser) {
            if (typeof closeApp === 'function') Object.keys(wins).forEach(id => closeApp(id));
            document.getElementById('start')?.classList.remove('open');
            document.getElementById('login-scr').style.display = 'flex';
            document.getElementById('login-pwd').value = '';
        } else {
            if (typeof switchSettingsTab === 'function') switchSettingsTab('users');
        }
    }
}

// УЛЬТРА-ОБНОВЛЕНИЕ ЯДРА V8 (ИСПРАВЛЕННЫЕ ИНДЕКСЫ КОМАНД)

const preStorePart1 = typeof handleTerminalCommand === 'function' ? handleTerminalCommand : function(){};
const preStorePart2 = typeof handleTerminalCommandPart2 === 'function' ? handleTerminalCommandPart2 : function(){};

handleTerminalCommand = function(cmd, out) {
    const p = cmd.trim().toLowerCase().split(' ');
    
    // Железное извлечение аргументов по индексам через специальный метод
    const baseCmd = p.length > 0 ? p[0] : '';
    const arg = p.length > 1 ? p[1] : '';
    const name = p.length > 2 ? p[2] : '';
    
    const inp = document.getElementById('term-inp'); 
    const list = ['notepad', 'paint', 'calc', 'tetris', 'flappy', 'browser', 'explorer', 'settings', 'store'];

    if (baseCmd === 'help') {
        out.innerText += `Список директив ядра ЭВМ:\n` +
                         `  help               - Вывод этого списка инструкций\n` +
                         `  clear              - Очистить экран консоли терминала\n` +
                         `  kgb --disable      - Отключить триггер шпионажа КГБ навсегда\n` +
                         `  kgb --enable       - Включить защиту КГБ обратно\n` +
                         `  settings --remove  - Полное удаление приложения Опции из системы\n` +
                         `  settings --install - Восстановить приложение Опции на рабочий стол\n` +
                         `  apps --list        - Показать список установленных приложений\n` +
                         `  apps --remove-all  - Удалить ВСЕ приложения (включая Магазин, БЫСТРО)\n` +
                         `  apps --install-all - Установить ВСЕ приложения по ровным ячейкам\n` +
                         `  apps --install [имя]- Точечная установка программы из архива (3 сек)\n` +
                         `  apps --remove [имя] - Точечное удаление программы из ядра (3 сек)\n` +
                         `  user --list        - Вывести список всех аккаунтов из базы данных\n` +
                         `  rm -rf system      - КРИТИЧЕСКАЯ: Полное стирание системы и Терминала\n\n` +
                         `Имена для команд apps: notepad, paint, calc, tetris, flappy, browser, explorer, settings, store\n\n`;
    } 
    else if (baseCmd === 'clear') { 
        out.innerText = ''; 
    } 
    else if (baseCmd === 'apps' && arg === '--list') {
        out.innerText += `Список установленных приложений в системе:\n`;
        if (activeApps.length === 0) {
            out.innerText += `  [Система пуста]\n\n`;
        } else {
            activeApps.forEach(id => {
                let lbl = id==='browser'?'Сеть':id==='settings'?'Опции':id==='store'?'Магазин':id==='explorer'?'Каталог':id==='notepad'?'Слово':id==='paint'?'Изо':id==='calc'?'Счёты':id==='tetris'?'Тетрис':'Птица';
                out.innerText += `  - Код: [${id}] | Имя: ${lbl}\n`;
            });
            out.innerText += `\n`;
        }
    }
    else {
        handleTerminalCommandPart2(baseCmd, arg, name, cmd, out, inp, list);
    }
    out.scrollTop = out.scrollHeight;
};

handleTerminalCommandPart2 = function(baseCmd, arg, name, cmd, out, inp, appsList) {
    const extList = ['notepad', 'paint', 'calc', 'tetris', 'flappy', 'browser', 'explorer', 'settings', 'store'];

    if (baseCmd === 'apps' && (arg === '--install' || arg === '--remove') && extList.includes(name)) {
        if (inp) inp.disabled = true;
        out.innerText += arg === '--install' ? `📦 Распаковка пакета ${name}.exe...\n` : `🚨 Деинсталляция модуля ${name}...\n`;
        
        setTimeout(() => {
            if (arg === '--install') {
                if (activeApps.includes(name)) {
                    out.innerText += `Ошибка: Приложение "${name}" уже есть на столе.\n\n`;
                } else {
                    activeApps.push(name);
                    if (appStatus[name] !== undefined) appStatus[name] = 2;
                    if (name === 'settings') sessionStorage.removeItem('e11_settings_deleted');
                    
                    let lbl = name==='browser'?'Сеть':name==='settings'?'Опции':name==='store'?'Магазин':name==='explorer'?'Каталог':name==='notepad'?'Слово':name==='paint'?'Изо':name==='calc'?'Счёты':name==='tetris'?'Тетрис':'Птица';
                    const d = document.getElementById('desk');
                    if (d && !document.getElementById(`i-${name}`)) {
                        const it = document.createElement('div'); it.className = 'ico'; it.id = `i-${name}`;
                        it.setAttribute('oncontextmenu', `showCtx(event,'${name}')`); it.setAttribute('onmousedown', `dragIco(event,'${name}')`);

function e11UniversalSave(fileName, content, type) {
    let targetName = fileName;

    if (!targetName || targetName.includes("Слово -") || targetName.includes("Изо -") || targetName === "📝 Слово" || targetName === "🎨 Изо") {
        let askName = prompt("Введите имя для нового файла (с расширением):", type === "image" ? "Рисунок.png" : "Документ.txt");
        if (!askName || !askName.trim()) return false;
        targetName = askName.trim();
    } else {
        // Убираем системные префиксы, если они остались в заголовке окна
        targetName = targetName.replace("📝 Слово - ", "").replace("🎨 Изо - ", "").trim();
    }

    const userKey = currentUser + "_" + targetName;
    const path = (typeof currentExplorerPath !== 'undefined' && currentExplorerPath !== 'root') ? currentExplorerPath : 'C';
    
    // Перезаписываем или создаем новый файл в VFS
    vfs = vfs.filter(f => f.userKey !== userKey);

window.openPulsarItem = function(file) {
    if (!file) return;

    if (file.type === 'image') {
        if (typeof openApp === 'function') openApp('paint');
        setTimeout(() => {
            const win = (typeof wins !== 'undefined' && wins) ? wins['paint'] : null;
            if (win) {
                const canv = win.querySelector('#canv');
                if (canv && file.content) {
                    const img = new Image();
                    img.onload = () => {
                        const cx = canv.getContext('2d');
                        cx.clearRect(0, 0, canv.width, canv.height);
                        cx.drawImage(img, 0, 0);
                    };
                    img.src = file.content;
                }
            }
        }, 50);
    } else {
        if (typeof openApp === 'function') openApp('notepad');
        setTimeout(() => {
            const win = (typeof wins !== 'undefined' && wins) ? wins['notepad'] : null;
            if (win) {
                const ntp = win.querySelector('.ntp');
                if (ntp) ntp.value = file.content || '';
            }
        }, 50);
    }
};

window.createPulsarItem = function(type) {
    let defaultName = type === 'image' ? 'Рисунок.png' : 'Документ.txt';
    let name = prompt("Введите имя файла:", defaultName);
    if (!name || !name.trim()) return;
    name = name.trim();

    const userKey = (typeof currentUser !== 'undefined' ? currentUser : 'user') + "_" + name;
    if (typeof vfs !== 'undefined' && vfs.some(f => f.userKey === userKey || f.name === name)) {
        alert("Файл с таким именем уже существует!");
        return;
    }

    const desktopFiles = (typeof vfs !== 'undefined' ? vfs : []).filter(f => f.posX && f.posY);
    let posX = 20, posY = 20;
    while (desktopFiles.some(f => f.posX === posX && f.posY === posY)) {
        posY += PULSAR_GRID_Y;
        if (posY > 480) { posY = 20; posX += PULSAR_GRID_X; }
    }

    const newItem = {
        name: name,
        user: typeof currentUser !== 'undefined' ? currentUser : 'default',
        userKey: userKey,
        type: type,
        content: '',
        posX: posX,
        posY: posY
    };

    if (typeof vfs !== 'undefined') {
        vfs.push(newItem);
    }
    saveVfsAndRefresh();
};

    menu.innerHTML = `

        <div id="p-delete" style="padding: 7px 14px; cursor: pointer; color: #d9534f;">🗑️ Удалить</div>
    `;

    menu.querySelectorAll('div').forEach(item => {
        item.onmouseover = () => item.style.background = '#f0f0f5';
        item.onmouseout = () => item.style.background = 'transparent';
    });

    document.getElementById('p-rename').onclick = () => {
        menu.remove();
        const newName = prompt("Введите новое имя:", file.name);
        if (newName && newName.trim() && newName.trim() !== file.name) {
            file.name = newName.trim();
            file.userKey = currentUser + "_" + file.name;
            saveVfsAndRefresh();
        }
    };

    document.getElementById('p-delete').onclick = () => {
        menu.remove();
        if (confirm(`Удалить "${file.name}"?`)) {
            vfs = vfs.filter(f => f !== file && f.userKey !== file.userKey);
            saveVfsAndRefresh();
        }
    };

    const closeMenu = () => {
        menu.remove();
        window.removeEventListener('click', closeMenu);
    };

// 4. ОТРИСОВКА СТРОГО ПОД РЕЖИМ СИСТЕМЫ
function renderPulsarDesktop() {
    let desktop = document.getElementById('pulsar-desktop');
    if (!desktop) {
        desktop = document.createElement('div');
        desktop.id = 'pulsar-desktop';
        desktop.style.cssText = 'position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 5;';
        document.body.appendChild(desktop);
    }

    // Жёсткий барьер: если мы не в Пульсаре — полностью гасим сетку и очищаем экран
    if (!isPulsarDesktopActive()) {
        desktop.style.display = 'none';
        desktop.innerHTML = '';
        return;
    }

    desktop.style.display = 'block';
    desktop.innerHTML = '';

    if (typeof vfs === 'undefined') return;

    const userFiles = vfs.filter(f => {
        if (!f || typeof f.posX === 'undefined' || typeof f.posY === 'undefined') return false;
        const isUser = (f.user === currentUser || !f.user);
        const isHidden = f.hidden === true || f.isSystem === true || (f.name && f.name.startsWith('.'));
        return isUser && !isHidden;
    });

    userFiles.forEach((file) => {
        const iconEl = document.createElement('div');
        iconEl.className = 'pulsar-desktop-icon';
        iconEl.style.cssText = `
            position: absolute; left: ${file.posX}px; top: ${file.posY}px;
            width: 82px; text-align: center; cursor: pointer; user-select: none;
            color: #ffffff; font-size: 12px; padding: 6px; border-radius: 8px;
            box-sizing: border-box; pointer-events: auto;
        `;

        let iconSymbol = file.type === 'image' ? '🎨' : '📄';

        iconEl.innerHTML = `
            <div style="font-size: 34px; line-height: 1;">${iconSymbol}</div>
            <div style="word-break: break-word; margin-top: 4px; text-shadow: 1px 1px 4px rgba(0,0,0,0.9); font-weight: 500;">${file.name}</div>
        `;

        iconEl.oncontextmenu = (e) => showPulsarContextMenu(e, file);

        let isDragging = false;
        let hasMoved = false;
        let startX, startY, initialLeft, initialTop;

        iconEl.onmousedown = (e) => {
            // Если случайно вызвалось вне Пульсара — блокируем перемещение сетки
            if (!isPulsarDesktopActive()) return;
            if (e.button !== 0) return;

            isDragging = true;
            hasMoved = false;
            startX = e.clientX;
            startY = e.clientY;
            initialLeft = iconEl.offsetLeft;
            initialTop = iconEl.offsetTop;

            const onMouseMove = (moveEvent) => {
                if (!isDragging) return;
                const dx = moveEvent.clientX - startX;
                const dy = moveEvent.clientY - startY;
                if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
                    hasMoved = true;
                    iconEl.style.zIndex = 1000;
                    iconEl.style.left = (initialLeft + dx) + 'px';
                    iconEl.style.top = (initialTop + dy) + 'px';
                }
            };

            const onMouseUp = () => {
                if (!isDragging) return;
                isDragging = false;
                if (hasMoved) {
                    let currentX = parseInt(iconEl.style.left, 10);
                    let currentY = parseInt(iconEl.style.top, 10);
                    file.posX = Math.max(10, Math.round(currentX / PULSAR_GRID_X) * PULSAR_GRID_X);
                    file.posY = Math.max(10, Math.round(currentY / PULSAR_GRID_Y) * PULSAR_GRID_Y);
                    iconEl.style.left = file.posX + 'px';
                    iconEl.style.top = file.posY + 'px';
                    iconEl.style.zIndex = 1;
                    saveVfsAndRefresh();
                }
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            };

            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        };

        iconEl.onclick = () => {
            if (!hasMoved) openPulsarItem(file);
        };

        desktop.appendChild(iconEl);
    });
}

window.triggerSystemShutdown = function() {
    // 1. ПРИНУДИТЕЛЬНОЕ ЗАКРЫТИЕ И ВЫКЛЮЧЕНИЕ ВСЕЙ СИСТЕМЫ
    // Закрываем меню Пуск, если оно открыто

    const desktopEl = document.getElementById('desk') || document.getElementById('desktop') || document.querySelector('.desktop');

    // Мёртвым грузом скрываем весь интерфейс рабочей системы с экрана
    if (desktopEl) desktopEl.style.display = 'none';
    if (taskbarEl) taskbarEl.style.display = 'none';
    
    // Если в системе открыты окна приложений (например, с классом .win или .app), уничтожаем их
    document.querySelectorAll('.win, .app, .window').forEach(win => win.remove());

    // 2. СОЗДАЕМ ЭКРАН ВЫКЛЮЧЕНИЯ
    const scr = document.createElement('div');
    scr.id = 'shd-scr';
    scr.style.cssText = 'position:fixed; top:0; left:0; width:100vw; height:100vh; background:#000000; z-index:99999999; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:monospace; color:#ff4f4f; user-select:none;';
    
    const box = document.createElement('div');
    box.style.cssText = 'text-align:center; width:300px;';
    
    const txt = document.createElement('div');
    txt.innerText = 'ЗАВЕРШЕНИЕ РАБОТЫ ЭВМ...';
    txt.style.cssText = 'font-size:14px; margin-bottom:15px; letter-spacing:2px; font-weight:bold;';
    box.appendChild(txt);
    
        // Полоса прогресса (внешняя рамка с полукруглыми краями)
    const pBg = document.createElement('div');
    pBg.style.cssText = 'width:100%; height:20px; border:2px solid #ff4f4f; padding:2px; box-sizing:border-box; background:#000; border-radius:10px; overflow:hidden;';
    
    // Внутренний бегунок (тоже с полукруглыми краями для идеального совпадения)
    const pBar = document.createElement('div');
    pBar.style.cssText = 'width:0%; height:100%; background:#ff4f4f; border-radius:8px; transition:width 0.1s linear;';
    pBg.appendChild(pBar);
    box.appendChild(pBg);
    scr.appendChild(box);
    
    const clock = document.createElement('div');
    clock.style.cssText = 'display:none; font-size:48px; font-weight:bold; color:#500000; text-shadow:0 0 10px #300000; letter-spacing:4px;';
    scr.appendChild(clock);
    
    document.body.appendChild(scr);
    
    // Анимация прогресс-бара завершения работы (10 секунд)
    let pct = 0;
    const pInterval = setInterval(() => {
        pct += 1;
        pBar.style.width = pct + '%';
        if (pct >= 100) {
            clearInterval(pInterval);
            box.style.display = 'none';
            clock.style.display = 'block';
            startNightMode();
        }
    }, 100);
        let clockInterval, blinkInterval;
    let isFullyShutdown = false; // По умолчанию включение заблокировано!
    
    function startNightMode() {
        isFullyShutdown = true; // Компьютер полностью выключен, теперь включить можно!
        
        const updateTime = () => {
            const d = new Date();
            const h = String(d.getHours()).padStart(2, '0');
            const m = String(d.getMinutes()).padStart(2, '0');
            const s = String(d.getSeconds()).padStart(2, '0');
            clock.innerText = `${h}:${m}:${s}`;
        };
        updateTime();
        clockInterval = setInterval(updateTime, 1000);
        
        const glow = document.createElement('div');
        glow.style.cssText = 'position:absolute; top:0; left:0; width:100%; height:100%; background:radial-gradient(circle, rgba(180,0,0,0.3) 0%, rgba(0,0,0,0) 70%); opacity:0; pointer-events:none; transition:opacity 1.2s ease-in-out; z-index:1;';
        scr.appendChild(glow);
        
        if (clock) clock.style.zIndex = '2';
        
        blinkInterval = setInterval(() => {
            glow.style.opacity = '1';
            setTimeout(() => { glow.style.opacity = '0'; }, 1300);
        }, 3800);
    }
    
    // ХОЛОДНЫЙ СТАРТ СИСТЕМЫ ПО КНОПКЕ TAB
    const handleTabWake = (e) => {
        if (e.key === 'Tab' || e.keyCode === 9) {
            e.preventDefault();
            
            // Если 10 секунд ещё не прошли — игнорируем нажатие! Линейные процессы не прервать.
            if (!isFullyShutdown) return; 
            
            document.removeEventListener('keydown', handleTabWake);
            
            clearInterval(pInterval);
            clearInterval(clockInterval);
            clearInterval(blinkInterval);
            
            clock.style.display = 'none';
            box.style.display = 'block';
            txt.innerText = 'ЗАГРУЗКА ЭВМ: ТЕСТИРОВАНИЕ ОЗУ...';
            pBar.style.width = '0%';
            
            let wpct = 0;
            const wInterval = setInterval(() => {
                wpct += 4;
                pBar.style.width = wpct + '%';
                if (wpct >= 100) {
                    clearInterval(wInterval);
                    scr.remove();
                    
                    if (desktopEl) desktopEl.style.display = '';
                    if (taskbarEl) taskbarEl.style.display = '';
                    if (typeof currentUser !== 'undefined') currentUser = ''; 
                    if (typeof updateLoginSelect === 'function') updateLoginSelect();
                    
                    const logScr = document.getElementById('login-scr');
                    if (logScr) logScr.style.display = 'flex';
                    
                    const pwdInp = document.getElementById('login-pwd');
                    if (pwdInp) pwdInp.value = '';
                }
            }, 100);
        }
    };
    
    document.addEventListener('keydown', handleTabWake);
};

      alert("Элемент с таким именем уже существует!");
      return;
    }

    var desktopFiles = (typeof vfs !== 'undefined' ? vfs : []).filter(function(f) { return f.posX && f.posY; });
    var posX = 20, posY = 20;
    while (desktopFiles.some(function(f) { return f.posX === posX && f.posY === posY; })) {
      posY += 90;
      if (posY > 480) { posY = 20; posX += 90; }
    }

    var newItem = {
      name: name,
      user: uName,
      userKey: userKey,
      type: type,
      content: '',
      posX: posX,
      posY: posY,
      folderPath: 'C'
    };
    if (typeof vfs !== 'undefined') vfs.push(newItem);

    if (type === 'folder' && typeof explorerFolders !== 'undefined') {
      var folderKey = uName + "*C*" + name;
      if (!explorerFolders.some(function(f) { return f.key === folderKey; })) {
        explorerFolders.push({
          key: folderKey,
          name: name,
          parent: 'C',
          user: uName
        });
        sessionStorage.setItem('e11_folders', JSON.stringify(explorerFolders));
      }
    }

    if (typeof saveVfsAndRefresh === 'function') saveVfsAndRefresh();
  };
})();
// Интегрированный JavaScript-код (часть 2Б) для перехвата отрисовки и контекстного меню рабочего стола Пульсара
(function() {

// СУПЕР-ФИКС ПАПОК — ЧАСТЬ А (БЛОКИРОВКА ДУБЛИКАТОВ В КАТАЛОГЕ)
(function() {
  var origRenderExplorer = window.renderExplorer;
  window.renderExplorer = function() {
    // 1. Сначала даем отработать вашему стандартному рендеру Проводника
    if (typeof origRenderExplorer === 'function') origRenderExplorer();
    
    var expView = document.getElementById('exp-view');
    if (!expView) return;

    // 2. Находим имена всех реальных папок в текущем Каталоге
    var activeFolders = [];
    expView.querySelectorAll('.exp-file').forEach(function(el) {
      var icon = el.querySelector('div')?.innerText || '';
      var name = el.querySelector('span')?.innerText || '';
      if (icon.includes('📁') && name && !name.includes('Назад') && !name.includes('Наверх')) {
        activeFolders.push(name.trim());
      }
    });

    // 3. Жестко удаляем из интерфейса Проводника текстовые файлы, которые дублируют папки
    expView.querySelectorAll('.exp-file').forEach(function(el) {
      var icon = el.querySelector('div')?.innerText || '';
      var name = el.querySelector('span')?.innerText || '';
      if ((icon.includes('📄') || icon.includes('⚙')) && name) {
        if (activeFolders.indexOf(name.trim()) !== -1) {
          el.remove();
        }
      }
    });

})();
// СУПЕР-ФИКС ПАПОК — ЧАСТЬ Б (ТОТАЛЬНОЕ УДАЛЕНИЕ ИЗ ПРОВОДНИКА)
(function() {

  window.showPulsarContextMenu = function(e, file) {

        if (typeof explorerFolders !== 'undefined') {

// СУПЕРФИКС УДАЛЕНИЯ — ЧАСТЬ 1 ИЗ 2 (СИНХРОНИЗАТОР ЯДРА ВФС)
(function() {
  if (typeof window.e11FolderDeleteInterval === 'undefined') {
    window.e11FolderDeleteInterval = setInterval(function() {
      var uName = typeof currentUser !== 'undefined' ? currentUser : 'admin';
      if (typeof explorerFolders === 'undefined' || typeof vfs === 'undefined') return;

      // Находим все папки текущего пользователя в Каталоге
      explorerFolders.forEach(function(folder) {
        if (folder.user !== uName || folder.parent !== 'C') return;

        // Проверяем, осталась ли эта папка на Рабочем столе (в vfs)
        var stillExistsOnDesktop = vfs.some(function(file) {
          return file.name === folder.name && file.user === uName && file.type === 'folder';
        });

        // Если с Рабочего стола папку уже удалили, а в Каталоге она зависла:
        if (!stillExistsOnDesktop) {
          var targetKey = uName + "*C*" + folder.name;
          explorerFolders = explorerFolders.filter(function(f) {
            return f.key !== targetKey && f.parent !== folder.name;
          });
          sessionStorage.setItem('e11_folders', JSON.stringify(explorerFolders));
          
          if (typeof renderExplorer === 'function') {
            renderExplorer();
          }
        }
      });
    }, 300);
  }
})();
// СУПЕРФИКС КОЛЛИЗИЙ №2 — ЧАСТЬ 1 ИЗ 2 (ПЕРЕХВАТ РЕНДЕРА)
(function() {
  var origRenderPulsar = window.renderPulsarDesktop;
  window.renderPulsarDesktop = function() {
    if (typeof vfs !== 'undefined' && document.body.classList.contains('redstar-theme')) {
      var uName = typeof currentUser !== 'undefined' ? currentUser : 'admin';
      var desktopFiles = vfs.filter(function(f) {
        return f.user === uName && f.posX !== undefined && f.posY !== undefined;
      });

      var changed = false;
      for (var i = 0; i < desktopFiles.length; i++) {
        var f1 = desktopFiles[i];
        for (var j = 0; j < desktopFiles.length; j++) {
          if (i === j) continue;
          var f2 = desktopFiles[j];

          // Проверяем точное совпадение ячеек сетки 90x90
          if (Math.abs(f1.posX - f2.posX) < 10 && Math.abs(f1.posY - f2.posY) < 10) {
            var newY = f1.posY;
            var newX = f1.posX;

            while (desktopFiles.some(function(f) { 
              return Math.abs(f.posX - newX) < 10 && Math.abs(f.posY - newY) < 10; 
            })) {
              newY += 90;
              if (newY > 480) {
                newY = 20;
                newX += 90;
              }
            }

            f1.posY = newY;
            f1.posX = newX;
            changed = true;
            break;
          }
        }
        if (changed) break;
      }

      if (changed && typeof saveVfsAndRefresh === 'function') {
        saveVfsAndRefresh();
      }
    }

    if (typeof origRenderPulsar === 'function') origRenderPulsar();
  };
})();

(function() {

           а просто ждет окончания анимации, оставаясь в DOM */
        body.redstar-theme .window.minimized {

            visibility: hidden;

// =================================================================
// МАК-ФИЧА ЧАСТЬ 2 ИЗ 3: ПЕРЕХВАТ И АНИМАЦИЯ ФУНКЦИИ TOGGLEAPP
// =================================================================
(function() {
    const originalToggleApp = window.toggleApp;
    if (typeof originalToggleApp !== 'function') return;

    window.toggleApp = function(id) {
        const isPulsar = document.body.classList.contains('redstar-theme');
        const win = wins[id];

        // Если мы не в Пульсаре, запускаем стандартную советскую логику без анимаций
        if (!isPulsar || !win) {
            originalToggleApp(id);
            return;
        }

        // --- ЛОГИКА ДЛЯ ПУЛЬСАРА («ВЫТЕКАНИЕ» ОКНА) ---
        
        // Случай 1: Окно открыто и активно — запускаем процесс СВОРАЧИВАНИЯ (втягивания)
        if (!win.classList.contains('minimized') && parseInt(win.style.zIndex) >= z) {
            // Находим кнопку приложения на панели задач, чтобы окно летело строго к ней
            const btn = document.getElementById('b-' + id);
            if (btn) {
                const btnRect = btn.getBoundingClientRect();
                const winRect = win.getBoundingClientRect();
                // Рассчитываем точное смещение по оси X и Y до иконки в Доке
                const targetX = (btnRect.left + btnRect.width / 2) - (winRect.left + winRect.width / 2);
                win.style.transformOrigin = `calc(50% + ${targetX}px) bottom`;
            } else {
                win.style.transformOrigin = 'center bottom';
            }

            // Включаем CSS-анимацию сжатия
            win.classList.add('pulsar-genie-minimized');
            
            // Ждем завершения анимации (400мс), после чего окончательно прячем окно
            setTimeout(() => {
                win.classList.add('minimized');
                if (typeof renderTaskbar === 'function') renderTaskbar();
            }, 400);

        } else {
            // Случай 2: Окно свернуто или на заднем плане — запускаем РАЗВОРАЧИВАНИЕ (вылетание)
            win.classList.remove('minimized');
            win.style.zIndex = z += 2;

            // Находим кнопку, чтобы окно вытекало ИМЕННО из своей иконки
            const btn = document.getElementById('b-' + id);
            if (btn) {
                const btnRect = btn.getBoundingClientRect();
                const winRect = win.getBoundingClientRect();
                const targetX = (btnRect.left + btnRect.width / 2) - (winRect.left + winRect.width / 2);
                win.style.transformOrigin = `calc(50% + ${targetX}px) bottom`;
            }

            // Даем браузеру один микро-тик прочитать убранный minimized, затем убираем сжатие
            requestAnimationFrame(() => {
                setTimeout(() => {
                    win.classList.remove('pulsar-genie-minimized');
                    if (typeof renderTaskbar === 'function') renderTaskbar();
                }, 10);
            });
        }
    };
})();
// =================================================================
// МАК-ФИЧА ЧАСТЬ 3 ИЗ 3: АНИМАЦИЯ «ВЫТЕКАНИЯ» ПРИ ПЕРВОМ ЗАПУСКЕ
// =================================================================
(function() {
    const originalOpenApp = window.openApp;
    if (typeof originalOpenApp !== 'function') return;

    window.openApp = function(id) {
        const isPulsar = document.body.classList.contains('redstar-theme');
        
        // 1. Проверяем, открыто ли уже приложение
        const alreadyOpen = !!wins[id];

        // 2. Запускаем оригинальный движок создания окна
        originalOpenApp(id);

        // Если мы в Пульсаре и приложение создается С НУЛЯ (его не было в DOM)
        if (isPulsar && !alreadyOpen) {
            const win = wins[id];
            if (!win) return;

            // Находим иконку в Доке для расчета точки вылета
            const btn = document.getElementById('b-' + id);
            if (btn) {
                const btnRect = btn.getBoundingClientRect();
                const winRect = win.getBoundingClientRect();
                const targetX = (btnRect.left + btnRect.width / 2) - (winRect.left + winRect.width / 2);
                win.style.transformOrigin = `calc(50% + ${targetX}px) bottom`;
            } else {
                win.style.transformOrigin = 'center bottom';
            }

            // Принудительно зажимаем окно у Дока и убираем прозрачность перед рендером
            win.style.transition = 'none !important';
            win.classList.add('pulsar-genie-minimized');

            // Даем DOM-дереву один кадр, чтобы применить сжатие, затем включаем плавное вытекание
            requestAnimationFrame(() => {
                setTimeout(() => {
                    win.style.removeProperty('transition');
                    win.classList.remove('pulsar-genie-minimized');
                }, 20);
            });
        }
    };
})();
// =================================================================
// СИНХРОНИЗАЦИЯ ДОКА ЧАСТЬ 1 ИЗ 2: ПЕРЕХВАТ МАГАЗИНА И УДАЛЕНИЯ
// =================================================================
(function() {
    // 1. Перехватываем стандартную функцию Магазина
    const originalStoreApp = window.handleStoreApp;
    if (typeof originalStoreApp === 'function') {
        window.handleStoreApp = function(id, lbl, ic) {
            // Запускаем родную логику (скачивание/удаление с таймером)
            originalStoreApp(id, lbl, ic);
            
            // Если мы в Пульсаре — подменяем массив закрепленных программ живым списком
            if (document.body.classList.contains('redstar-theme')) {
                // Магазин использует таймауты для прогресс-бара, поэтому делаем проверку и через 100мс, и после завершения
                setTimeout(() => {
                    if (typeof pinnedApps !== 'undefined') {
                        pinnedApps = [...activeApps];
                        if (typeof renderTaskbar === 'function') renderTaskbar();
                    }
                }, 150);
            }
        };
    }

    // 2. Перехватываем всплывающее автономное окно удаления (для Delete и контекстного меню)
    const originalAutonomousUninstall = window.startAutonomousUninstall;
    if (typeof originalAutonomousUninstall === 'function') {
        window.startAutonomousUninstall = function(id) {
            originalAutonomousUninstall(id);
            
            // Как только запускается деинсталляция, плавно вычеркиваем приложение из Дока на лету
            if (document.body.classList.contains('redstar-theme') && typeof pinnedApps !== 'undefined') {
                pinnedApps = pinnedApps.filter(a => a !== id);
                if (typeof renderTaskbar === 'function') renderTaskbar();
            }
        };
    }
})();
// =================================================================
// СИНХРОНИЗАЦИЯ ДОКА ЧАСТЬ 2 ИЗ 2: ГЛОБАЛЬНЫЙ МОНИТОРИНГ ЯДРА ВФС
// =================================================================
(function() {
    // 1. Ставим фоновый микро-интервал (срабатывает каждые 200 миллисекунд)
    // Он страхует систему при ручном скачивании Терминала, фоновых таймаутах и сбросах
    if (typeof window.e11PulsarDockSyncInterval === 'undefined') {
        window.e11PulsarDockSyncInterval = setInterval(function() {
            // Работаем только если активна оболочка Пульсара
            if (!document.body.classList.contains('redstar-theme')) return;
            if (typeof activeApps === 'undefined' || typeof pinnedApps === 'undefined') return;

            // Сверяем количество элементов. Если списки разошлись — принудительно выравниваем
            // Исключаем дубликаты с помощью Set
            const uniqueActive = Array.from(new Set(activeApps));
            
            if (pinnedApps.length !== uniqueActive.length || !pinnedApps.every(val => uniqueActive.includes(val))) {
                pinnedApps = [...uniqueActive];
                if (typeof renderTaskbar === 'function') renderTaskbar();
            }
        }, 200);
    }

    // 2. Жесткий перехват точечных консольных команд Терминала (Part 2)
    // Чтобы при вызове "apps --install [имя]" или "apps --remove [имя]" Док перестраивался ровно на 3-й секунде лога
    const originalTermPart2 = typeof handleTerminalCommandPart2 === 'function' ? handleTerminalCommandPart2 : null;

(function() {

    document.addEventListener('keydown', function(e) {

(function() {
    // 3. Прямая привязка к твоим массивам выбора версий ОС
    window.runAdvancedSystemSetup = function(cmd, out, inp) {
        var isCore = cmd.indexOf('--special-core') !== -1;
        var isDev = cmd.indexOf('--dev-edition') !== -1;

        if (!isCore && !isDev) {
            var err = document.createElement('div');
            err.style.color = '#ff5f56'; 
            err.innerText = 'Ошибка параметров установки.';
            out.appendChild(err);
            return;
        }

        inp.disabled = true;
        
        // Скрываем текстовый БИОС
        var biosOverlay = document.getElementById('e11-bios-screen');
        if (biosOverlay) biosOverlay.style.display = 'none';
        sessionStorage.setItem('e11_sys_init', 'true');
        
        // Открываем твой оригинальный экран установки ОС
        var defaultSetup = document.getElementById('sys-setup');
        if (defaultSetup) defaultSetup.style.setProperty('display', 'flex', 'important');

        // Эмулируем клик по твоим карточкам, чтобы запустить твой родной желтый прогресс-бар
        var setupCards = document.querySelectorAll('#sys-setup .card, #sys-setup [class*="card"]');
        var cardsContainer = document.getElementById('setup-cards');
        if (cardsContainer) cardsContainer.style.setProperty('display', 'none', 'important');

        if (setupCards && setupCards.length > 0) {
            if (isCore) {
                if (setupCards[0]) setupCards[0].click(); // Клик по "Полной"
            } else if (isDev) {
                if (setupCards[2]) setupCards[2].click(); // Клик по "Домашней" для докачки
                else if (setupCards[1]) setupCards[1].click();
            }
        }

        // Фоновый перехват твоего прогресс-бара на 60% ради хакерского алерты
        var myProgressBar = document.querySelector('#sys-setup .progress-bar') || 
                             document.querySelector('#sys-setup [class*="progress"]') || 
                             document.getElementById('setup-progress');

        var alertTriggered = false;

        if (myProgressBar) {
            var observer = new MutationObserver(function(mutations) {
                mutations.forEach(function(mutation) {
                    var currentWidth = myProgressBar.style.width || "0%";
                    var numericProgress = parseInt(currentWidth, 10) || 0;

                    if (numericProgress >= 60 && !alertTriggered) {
                        alertTriggered = true;
                        var oldTransition = myProgressBar.style.transition;
                        myProgressBar.style.transition = 'none';

                        var overlayAlert = document.createElement('div');
                        overlayAlert.style.cssText = 'position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); border:2px dashed #00ff00; background:#000000; padding:20px; color:#00ff00; font-family:monospace; font-size:16px; text-align:center; z-index:10000001; box-shadow:0 0 20px rgba(0,255,0,0.5); animation: biosFlash 0.5s infinite alternate;';
                        
                        if (isCore) {
                            overlayAlert.innerText = '[ ВНИМАНИЕ: СИСТЕМА МОДЕРНИЗИРОВАНА. ТЕРМИНАЛ ИНЖЕКТИРОВАН В ЯДРО ЭВМ ]';
                        } else if (isDev) {
                            overlayAlert.innerText = '[ ИНЖЕНЕРНЫЙ МОД: АКТИВИРОВАНА ЧИСТАЯ СРЕДА ПУЛЬСАР ]';
                        }
                        
                        document.body.appendChild(overlayAlert);

                        setTimeout(function() {
                            if (overlayAlert) overlayAlert.remove();
                            myProgressBar.style.transition = oldTransition;
                            observer.disconnect(); 
                        }, 3000);
                    }
                });
            });
            observer.observe(myProgressBar, { attributes: true, attributeFilter: ['style'] });
        }

        // КОНФИГУРАЦИЯ МАССИВОВ (Прямо дописываем терминал в твои системные переменные)
        if (isCore) {
            currentOsType = "full"; // Переводим ядро в режим полной ОС
            
            // Зашиваем иконку ноутбука в твою базу соответствий приложений

            // Прямо приписываем 'terminal' к твоим массивам панели задач и рабочего стола!

            if (typeof appStatus !== 'undefined') appStatus['terminal'] = 2;

        } else if (isDev) {
            // Для Пульсара включаем тему и оставляем в массивах ТОЛЬКО Браузер и Проводник под докачку
            sessionStorage.setItem('e11_redstar_unlocked', 'true');

                pinnedApps.length = 0;

                    };

                    // 🟢 СОЗДАЕМ ЗЕЛЕНУЮ КНОПКУ (На весь экран)
                    const greenBtn = redBtn.cloneNode(true);
                    greenBtn.removeAttribute('onclick');
                    greenBtn.className = 'e11-maximize-btn';
                    greenBtn.style.cssText = baseStyle;
                    greenBtn.style.setProperty('background-color', '#27c93f', 'important');
                    greenBtn.style.setProperty('border-color', '#1aab2a', 'important');
                    greenBtn.style.setProperty('color', 'transparent', 'important');
                    greenBtn.setAttribute('title', 'На весь экран');

                    greenBtn.onclick = function(e) {
                        e.stopPropagation();
                        if (win.getAttribute('data-maximized') === 'true') {
                            win.style.top = win.getAttribute('data-old-top') || '100px';
                            win.style.left = win.getAttribute('data-old-left') || '100px';
                            win.style.width = win.getAttribute('data-old-width') || '550px';
                            win.style.height = win.getAttribute('data-old-height') || '380px';
                            win.removeAttribute('data-maximized');
                        } else {
                            win.setAttribute('data-old-top', win.style.top || '100px');
                            win.setAttribute('data-old-left', win.style.left || '100px');
                            win.setAttribute('data-old-width', win.style.width || '550px');
                            win.setAttribute('data-old-height', win.style.height || '380px');

                            win.style.left = '0px';
                            win.style.width = '100vw';
                            
                            if (document.body.classList.contains('redstar-theme')) {
                                win.style.top = '30px';
                                win.style.height = 'calc(100vh - 110px)'; 
                            } else {
                                win.style.top = '0px';
                                win.style.height = 'calc(100vh - 40px)'; 
                            }
                            win.setAttribute('data-maximized', 'true');
                        }
                        const canvas = win.querySelector('canvas');
                        if (canvas) canvas.dispatchEvent(new Event('resize'));
                    };

                    // Вставляем их в шапку
                    redBtn.parentNode.insertBefore(yellowBtn, redBtn);
                    redBtn.parentNode.insertBefore(greenBtn, redBtn);
                }

                // --- НЕПРЕРЫВНОЕ МАТЕМАТИЧЕСКОЕ ВЫРАВНИВАНИЕ ---
                // Каждые 300мс скрипт проверяет, где стоит Красная кнопка, и жестко привязывает к ней Желтую и Зеленую
                const yellow = win.querySelector('.e11-minimize-btn');
                const green = win.querySelector('.e11-maximize-btn');

                if (yellow && green) {
                    // Вычисляем положение Красной кнопки относительно её родительской шапки
                    const redLeft = redBtn.offsetLeft;
                    const redTop = redBtn.offsetTop;
                    const w = redBtn.offsetWidth || 12;

                    // Зазор между кнопками (4 пикселя)
                    const gap = 4;

                    // Зеленая встает строго слева от Красной
                    green.style.top = redTop + 'px';
                    green.style.left = (redLeft - w - gap) + 'px';

                    // Желтая встает строго слева от Зеленой
                    yellow.style.top = redTop + 'px';
                    yellow.style.left = (redLeft - (w * 2) - (gap * 2)) + 'px';
                }
            });
        }, 300);
    }

// =================================================================
(function() {

    if (typeof icons !== 'undefined') icons[id] = '📡';
    if (typeof appStatus !== 'undefined' && appStatus[id] === undefined) {
        appStatus[id] = 2;

    let peer = null;
    let currentConnection = null;
    let localStream = null;
    let remoteStream = null;
    let currentCall = null;
    let mediaRecorder = null;
    let audioChunks = [];

    if (typeof window.buildDesktop === 'function') {
        const originalBuildDesktop = window.buildDesktop;
        window.buildDesktop = function(...args) {
            originalBuildDesktop(...args);
            if (typeof activeApps !== 'undefined' && !activeApps.includes(id)) activeApps.push(id);

            const desk = document.getElementById('desk');

                }
                const label = document.querySelector(`#i-${id} span`) || document.getElementById(`lbl-${id}`);
                if (label) label.innerText = 'Связь';
            }, 15);
        };
        window.buildDesktop();
    }

    if (typeof window.renderTaskbar === 'function') {
        const originalRenderTaskbar = window.renderTaskbar;
